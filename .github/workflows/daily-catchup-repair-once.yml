name: Hunter DAILY catch-up repair once

on:
  push:
    branches:
      - main
    paths:
      - '.repair-trigger/hunter-daily-catchup-20260930'

permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Regression gate
        run: python -m unittest tests.test_foundation.FoundationTests.test_base_date_new_listing_bootstrap_counts_base_as_available
      - name: Live Bridge DAILY validator probe
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python - <<'PY'
          import gzip, io, json, requests, uuid, zlib
          from tests.release_bridge import Drive, sample_2026_09_25, submit
          drive = Drive()
          drive.health()
          row = sample_2026_09_25(drive, "US")
          raw = (json.dumps(row, ensure_ascii=False, separators=(",", ":"), allow_nan=False) + "\n").encode("utf-8")
          tiny = {"security_id":"US-TEST","date":"2026-09-25","trade_date":"2026-09-25",
                  "open":1.0,"high":1.0,"low":1.0,"close":1.0,"volume":1}
          tiny_raw = (json.dumps(tiny, separators=(",", ":"), allow_nan=False) + "\n").encode("utf-8")
          tiny_path = f"_BRIDGE_TEST/DAILY/US/2026-09-25/{uuid.uuid4().hex}/part-0001.ndjson.gz"
          tiny_result = submit(requests.Session(), drive.url, drive.key, "append", tiny_path,
                               gzip.compress(tiny_raw))
          print("BRIDGE_TINY_OK=" + str(bool(tiny_result.get("ok"))).lower())
          print("BRIDGE_TINY_ERROR=" + str(tiny_result.get("error") or "NONE"))
          variants = {}
          variants["mtime0"] = gzip.compress(raw, mtime=0)
          variants["default"] = gzip.compress(raw)
          buf = io.BytesIO()
          with gzip.GzipFile(filename="payload.ndjson.gz", mode="wb", fileobj=buf) as gz:
              gz.write(raw)
          variants["named"] = buf.getvalue()
          co = zlib.compressobj(level=9, wbits=31)
          variants["zlib31"] = co.compress(raw) + co.flush()
          passed = []
          for label, payload in variants.items():
              run = uuid.uuid4().hex
              path = f"_BRIDGE_TEST/DAILY/US/2026-09-25/{run}/part-0001.ndjson.gz"
              result = submit(requests.Session(), drive.url, drive.key, "append", path, payload)
              print(f"BRIDGE_GZIP_{label}_OK=" + str(bool(result.get("ok"))).lower())
              print(f"BRIDGE_GZIP_{label}_ERROR=" + str(result.get("error") or "NONE"))
              if result.get("ok"):
                  passed.append(label)
          print("BRIDGE_GZIP_PASS_VARIANTS=" + ",".join(passed))
          if not passed:
              raise SystemExit(2)
          PY
      - name: Catch up US DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode auto --market US
      - name: Catch up HK DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode auto --market HK
