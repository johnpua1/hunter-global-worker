name: hardening-check

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bridge authorization tests
        run: node tests/test_bridge.js
      - name: Shell syntax
        run: bash -n cloudrun/deploy.sh cloudrun/deploy-monthly.sh cloudrun/deploy-monthly-full.sh cloudrun/deploy-daily-control-plane.sh cloudrun/enforce-four-job-topology.sh cloudrun/enforce-four-job-topology-full.sh cloudrun/schedule.sh cloudrun/phase1.sh cloudrun/iam-audit.sh
      - name: Literal escape guard
        run: |
          ! grep -R -nF '\\nexport ' cloudrun/*.sh
      - name: Python dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Python syntax
        run: python -m py_compile hunter-global/*.py
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
