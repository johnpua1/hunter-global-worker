name: Hunter DAILY automatic rank closeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-daily-auto-rank.yml'
  schedule:
    # GitHub cron UTC. US: 08:20/09:20/10:20 MYT, Tue-Sat.
    - cron: '20 0,1,2 * * 2-6'
    # HK: 20:20/21:20/22:20 MYT, Mon-Fri.
    - cron: '20 12,13,14 * * 1-5'

permissions:
  contents: read

jobs:
  dated-rank-closeout:
    strategy:
      fail-fast: false
      matrix:
        market: [US, HK]
    concurrency:
      group: hunter-global-${{ matrix.market }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Hunter requirements
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Verify pure current-date ranking logic
        run: python -m unittest discover -s tests -p 'test_daily_rank_autoclose.py' -v
      - name: Automatically finish only the next COMPLETE daily ranking
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: 'CONFIRMED'
          HUNTER_BRIDGE_READ_TIMEOUT_SECONDS: '90'
          HUNTER_BRIDGE_WRITE_TIMEOUT_SECONDS: '180'
          HUNTER_BRIDGE_ATTEMPTS: '4'
          DERIVED_READ_WORKERS: '4'
          MARKET: ${{ matrix.market }}
        run: |
          python daily_rank_autoclose.py --market "$MARKET"
