name: Hunter daily catch-up once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  market:
    if: ${{ contains(github.event.head_commit.message, 'RUN_HUNTER_DAILY_CATCHUP') }}
    strategy:
      fail-fast: false
      matrix:
        market: [US, HK]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hunter-global-${{ matrix.market }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Catch up DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode auto --market "${{ matrix.market }}"
