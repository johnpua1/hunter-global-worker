name: Hunter DAILY safety net

on:
  schedule:
    # Safety net after the existing Apps Script / Cloud Run US window.
    # 08:15 MYT Tue-Sat = 00:15 UTC Tue-Sat.
    - cron: '15 0 * * 2-6'
    # Safety net after the existing Apps Script / Cloud Run HK window.
    # 19:30 MYT Mon-Fri = 11:30 UTC Mon-Fri.
    - cron: '30 11 * * 1-5'
    # Keep a public-repo scheduled workflow from being disabled for inactivity.
    - cron: '5 0 1 * *'
  workflow_dispatch:
    inputs:
      market:
        description: Market to catch up
        required: true
        type: choice
        options:
          - BOTH
          - US
          - HK

permissions:
  contents: read

jobs:
  us:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 0 * * 2-6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'US' || inputs.market == 'BOTH'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hunter-global-US
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Catch up US DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode daily-core --market US

  hk:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 11 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hunter-global-HK
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Catch up HK DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode daily-core --market HK

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '5 0 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Keep scheduled workflow active
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git commit --allow-empty -m 'ci: Hunter DAILY schedule keepalive [skip ci]'
          git push origin HEAD:main
