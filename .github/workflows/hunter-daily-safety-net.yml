name: Hunter DAILY safety net

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to catch up
        required: true
        type: choice
        options:
          - BOTH
          - US
          - HK

permissions:
  contents: read

jobs:
  us:
    if: github.event_name == 'workflow_dispatch' && (inputs.market == 'US' || inputs.market == 'BOTH')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hunter-global-US
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Catch up US DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode daily-core --market US
      - name: Verify US DAILY health
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: python daily_health.py --market US

  hk:
    if: github.event_name == 'workflow_dispatch' && (inputs.market == 'HK' || inputs.market == 'BOTH')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hunter-global-HK
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Catch up HK DAILY
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: CONFIRMED
          FETCH_WORKERS: '6'
        run: python runner.py --mode daily-core --market HK
      - name: Verify HK DAILY health
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: python daily_health.py --market HK
