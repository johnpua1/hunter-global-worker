name: Hunter Global Drive worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe or append missed daily sessions (BASE sealed)
        required: true
        type: choice
        options:
          - probe
          - mini
          - auto
          - daily
          - analytics
          - keepalive

permissions:
  contents: read

jobs:
  market:
    if: ${{ inputs.mode != 'keepalive' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'probe' || inputs.mode == 'mini' || inputs.mode == 'auto' || inputs.mode == 'analytics') }}
    strategy:
      fail-fast: false
      matrix:
        market: [US, HK]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: hunter-global-${{ matrix.market }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Process market
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: ${{ vars.HUNTER_ACTIONS_CUTOVER }}
          FETCH_WORKERS: '6'
          HUNTER_MODE: ${{ inputs.mode }}
          HUNTER_MARKET: ${{ matrix.market }}
        run: |
          python runner.py --mode "$HUNTER_MODE" --market "$HUNTER_MARKET"

  keepalive:
    if: ${{ inputs.mode == 'keepalive' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: hunter-global-keepalive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Keep the repository active
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git commit --allow-empty -m 'ci: manual keepalive [skip ci]'
          git push origin HEAD:main
