# Historical one-shot HK backfill (2026-10-20) was executed successfully but
# its final verification falsely demanded data for 2026-10-19, a CLOSED HKEX
# securities market holiday (the day after Chung Yeung Festival).
# HKEX official schedule:
# https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2025/ce_SEHK_CT_075_2025.pdf
# This former writer workflow is now a READ-ONLY final receipt check.
# Do not restore the duplicate GitHub worker: production writer is Cloud Run.
name: Hunter HK holiday-aware final receipt verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-hk-oneoff-bridge-backfill-20261020.yml'

permissions:
  contents: read

concurrency:
  group: hunter-hk-oneoff-bridge-backfill-20261020
  cancel-in-progress: false

jobs:
  verify-hk-no-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify only actual HK trading day 2026-10-20, rank and Phase 2
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python - <<'PY'
          import base64
          import importlib.util
          import json
          import os
          from pathlib import Path

          bridge_file=Path("cloudrun/apps-script-post.py")
          spec=importlib.util.spec_from_file_location("hunter_bridge_post",bridge_file)
          bridge=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bridge)

          url=os.environ["APPS_SCRIPT_WEBAPP_URL"]
          key=os.environ["APPS_SCRIPT_SHARED_KEY"]

          def call(op,path):
              r=bridge.post_json(url,{"op":op,"key":key,"path":path})
              if r.get("ok") is not True:
                  raise RuntimeError("HK_RECEIPT_READ_FAILED:"+path)
              return r

          def load_json(path):
              packet=call("read",path)
              raw=base64.b64decode(packet["data_base64"])
              return json.loads(raw.decode("utf-8"))

          # HKEX CLOSED on Mon 2026-10-19: no DAILY_RUN or RANK expected.
          # The next eligible cash trading date after Friday Oct 16 is Oct 20.
          day="2026-10-20"
          print("HKEX_2026_10_19=OFFICIAL_MARKET_HOLIDAY_NOT_A_MISSING_SESSION")
          cp=load_json("HK/CONTROL/DAILY_CHECKPOINT.json")
          if cp.get("market")!="HK":
              raise RuntimeError("HK_CHECKPOINT_MARKET_MISMATCH")
          completed=cp.get("last_completed_date","")
          phase=cp.get("phase2_completed_date","")
          if completed<day or phase<day or completed!=phase or not cp.get("phase2_completed_at_myt"):
              raise RuntimeError("HK_CHECKPOINT_OR_PHASE2_NOT_COMMITTED:"+json.dumps(cp,sort_keys=True))

          daily=load_json(f"HK/CONTROL/DAILY_RUN_{day}.json")
          if daily.get("market")!="HK" or daily.get("trade_date")!=day or daily.get("status")!="COMPLETE":
              raise RuntimeError("HK_DAILY_RUN_1020_NOT_COMPLETE")

          rank=load_json(f"HK/DERIVED/{day}/RANK.json")
          if rank.get("market")!="HK" or rank.get("as_of")!=day:
              raise RuntimeError("HK_RANK_1020_IDENTITY_MISMATCH")
          rows=rank.get("rows")
          parts=rank.get("detail_parts")
          if not isinstance(rows,list) or not rows or type(parts) is not int or parts<1:
              raise RuntimeError("HK_RANK_1020_CONTENT_INVALID")
          for index in range(1,parts+1):
              part=f"HK/DERIVED/{day}/batch-{index:04d}.json"
              if not call("file",part).get("file"):
                  raise RuntimeError("HK_RANK_DETAIL_PART_MISSING:"+part)
          print("HK_2026_10_20_DAILY=COMPLETE")
          print("HK_2026_10_20_RANK_ROWS="+str(len(rows)))
          print("HK_2026_10_20_RANK_DETAIL_PARTS="+str(parts))
          print("HK_2026_10_20_PHASE2_CHECKPOINT="+phase)
          print("HK_HOLIDAY_AWARE_PRODUCTION_RECEIPT_VALIDATION=PASS")
          print("READ_ONLY=TRUE NO_PRODUCTION_JOB_OR_GITHUB_WORKER_EXECUTED")
          PY
