# Retired direct GitHub Cloud Run catchup, replaced by one-time read-only
# HK incident evidence collection. Production writers remain Apps Script-only.
name: Hunter HK production read-only evidence 20261021

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-hk-production-catchup-20261020.yml'

permissions:
  contents: read

concurrency:
  group: hunter-hk-production-readonly-20261021
  cancel-in-progress: false

jobs:
  inspect-hk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read only HK primary trigger, deployed image and 2026-10-21 receipt
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python - <<'PY'
          import base64
          import importlib.util
          import json
          import os
          from pathlib import Path

          source=Path("cloudrun/apps-script-post.py")
          spec=importlib.util.spec_from_file_location("hunter_bridge",source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          def call(op,**data):
              args={"op":op,"key":os.environ["APPS_SCRIPT_SHARED_KEY"]}
              args.update(data)
              result=module.post_json(os.environ["APPS_SCRIPT_WEBAPP_URL"],args)
              if result.get("ok") is not True:
                  raise RuntimeError("READ_ONLY_BRIDGE_FAILED:"+op+":"+str(result.get("error")))
              return result
          triggers=call("daily_trigger_status")
          print("HK_PRIMARY_TRIGGER_COUNT="+str((triggers.get("daily") or {}).get("counts",{}).get("dailyHK")))
          topology=call("topology_status")
          job=((topology.get("jobs") or {}).get("HK") or {})
          print("HK_JOB_IMAGE="+str(job.get("image")))
          print("HK_JOB_GENERATION="+str(job.get("generation")))
          print("HK_JOB_ARGS="+json.dumps(job.get("args")))
          print("HK_JOB_UPDATED="+str(job.get("updateTime")))
          packet=call("read",path="HK/CONTROL/DAILY_CHECKPOINT.json")
          checkpoint=json.loads(base64.b64decode(packet["data_base64"]))
          print("HK_CHECKPOINT="+json.dumps(checkpoint,sort_keys=True))
          for path in ("HK/CONTROL/DAILY_RUN_2026-10-21.json",
                       "HK/DERIVED/2026-10-21/RANK.json"):
              print(path+"="+str(bool(call("file",path=path).get("file"))))
          print("DIAGNOSTIC_READ_ONLY=TRUE")
          print("CLOUD_RUN_DISPATCH=NONE")
          print("PRODUCTION_DATA_MUTATION=NONE")
          PY
