name: Hunter one-shot 2026-10-08 rank closeout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-rank-closeout-20261009.yml'
permissions:
  actions: read
  contents: read
jobs:
  gate-prior-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - name: Ensure prior repair is no longer writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/37860317023" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "UNKNOWN"))')"
            echo "PRIOR_REPAIR attempt=${attempt} status=${status}"
            if [[ "${status}" == 'completed' ]]; then
              echo 'PRIOR_REPAIR_WRITER_FINISHED=YES'
              exit 0
            fi
            sleep 15
          done
          echo 'PRIOR_REPAIR_STILL_ACTIVE: refusing concurrent closeout' >&2
          exit 1
  rank-and-checkpoint:
    needs: gate-prior-repair
    strategy:
      fail-fast: false
      matrix:
        market: [US, HK]
    concurrency:
      group: hunter-global-${{ matrix.market }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Hunter dependencies
        run: python -m pip install -r hunter-global/requirements.txt
      - name: Build verified 10-08 ranking and commit checkpoint only on success
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
          HUNTER_ACTIONS_CUTOVER: 'CONFIRMED'
          HUNTER_BRIDGE_READ_TIMEOUT_SECONDS: '90'
          HUNTER_BRIDGE_WRITE_TIMEOUT_SECONDS: '180'
          DERIVED_READ_WORKERS: '4'
          MARKET: ${{ matrix.market }}
        run: python rank_closeout_once_20261009.py --market "$MARKET" --date 2026-10-08
