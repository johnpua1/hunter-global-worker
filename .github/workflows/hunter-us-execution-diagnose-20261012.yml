name: Hunter US execution diagnose 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-us-execution-diagnose-20261012.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read Cloud Run execution status through existing Bridge
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, pathlib
          path=pathlib.Path("cloudrun/apps-script-post.py")
          spec=importlib.util.spec_from_file_location("bridgepost",path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          result=mod.post_json(os.environ["APPS_SCRIPT_WEBAPP_URL"],
              {"op":"topology_status","key":os.environ["APPS_SCRIPT_SHARED_KEY"]})
          if not result.get("ok"):
              raise SystemExit("TOPOLOGY_STATUS_FAILED:"+json.dumps(result,sort_keys=True))
          jobs=result.get("jobs") or {}
          def project(job):
              data=jobs.get(job) or {}
              return {k:data.get(k) for k in ("job","generation","latestCreatedExecution","image","args","updateTime")}
          print("US_JOB_CONFIG="+json.dumps(project("US"),ensure_ascii=False,sort_keys=True))
          print("HK_JOB_CONFIG="+json.dumps(project("HK"),ensure_ascii=False,sort_keys=True))
          print("DAILY_STATUS="+json.dumps(result.get("daily") or {},ensure_ascii=False,sort_keys=True))
          # 2026-10-20 incident: strictly read-only current HK control-plane receipt checks.
          # Never dispatch jobs or alter production files in this diagnostic.
          for date in ("2026-10-22","2026-10-23"):
              doc=mod.post_json(os.environ["APPS_SCRIPT_WEBAPP_URL"],{
                 "op":"file","key":os.environ["APPS_SCRIPT_SHARED_KEY"],
                 "path":f"US/CONTROL/DAILY_RUN_{date}.json"
              })
              print(f"US_{date}_DAILY_RUN_EXISTS="+str(bool(doc.get("ok") and doc.get("file"))))
          PY
