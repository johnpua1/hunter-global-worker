name: Hunter Phase 1 HK identity fast close once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-hk-identity-fastclose-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HUNTER_ACTIONS_CUTOVER: CONFIRMED

concurrency:
  group: hunter-phase1-hk-identity-fastclose
  cancel-in-progress: true

jobs:
  fastclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r hunter-global/requirements.txt
      - name: Close HK identity reviews from official evidence
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python - <<'PY'
          import json
          from runner import Drive, compact, digest, now_myt
          from foundation import current_universe
          from repair import decide

          drive = Drive()
          drive.health()
          securities = {s["security_id"]: s for s in current_universe(drive, "HK")}

          raw = drive.read("REPAIR_QUEUE.json")
          doc = json.loads(raw)
          accepted = []
          indices = []
          for index, original in enumerate(doc["items"]):
              if not (original.get("market") == "HK"
                      and original.get("category") == "IDENTITY_REVIEW"
                      and original.get("status", "OPEN") == "OPEN"):
                  continue
              sid = original.get("security_id")
              sec = securities.get(sid)
              if sec is None:
                  continue
              answer = decide(drive, dict(original), sec, None)
              if answer.get("result") == "IDENTITY_FIXED" and answer.get("accepted"):
                  accepted.append(answer)
                  indices.append(index)

          if accepted:
              payload = {"market": "HK", "kind": "IDENTITY_FASTCLOSE_BULK",
                         "accepted": True, "count": len(accepted),
                         "verified_at_myt": now_myt(), "items": accepted}
              patch_sha = digest(compact(payload))
              # Preserve the existing REPAIR_PATCH one-shard path contract.
              path = f"HK/REPAIR_PATCH/{patch_sha[:2]}/bulk-{patch_sha[:24]}.json"
              if not drive.file(path):
                  drive.append(path, compact(payload))

              for index, answer in zip(indices, accepted):
                  item = dict(doc["items"][index])
                  item["patch_path"] = path
                  item["patch_sha"] = patch_sha
                  item.update(status="IDENTITY_FIXED",
                              verified_at_myt=answer["verified_at_myt"],
                              reason=answer.get("reason"))
                  doc["items"][index] = item

              for _ in range(8):
                  latest_raw = drive.read("REPAIR_QUEUE.json")
                  latest = json.loads(latest_raw)
                  changed = 0
                  for index, answer in zip(indices, accepted):
                      if latest["items"][index].get("status", "OPEN") != "OPEN":
                          continue
                      item = dict(latest["items"][index])
                      item["patch_path"] = path
                      item["patch_sha"] = patch_sha
                      item.update(status="IDENTITY_FIXED",
                                  verified_at_myt=answer["verified_at_myt"],
                                  reason=answer.get("reason"))
                      latest["items"][index] = item
                      changed += 1
                  try:
                      drive.put("REPAIR_QUEUE.json", compact(latest),
                                expected_sha=digest(latest_raw))
                      print(f"HK_IDENTITY_FASTCLOSE bulk={len(accepted)} queue_changed={changed}", flush=True)
                      break
                  except RuntimeError as exc:
                      if "BRIDGE_STALE_WRITE" not in str(exc):
                          raise
              else:
                  raise RuntimeError("HK_IDENTITY_QUEUE_CAS_EXHAUSTED")

          final = drive.json("REPAIR_QUEUE.json")["items"]
          remaining = sum(x.get("market") == "HK"
                          and x.get("category") == "IDENTITY_REVIEW"
                          and x.get("status", "OPEN") == "OPEN" for x in final)
          print(f"HK_IDENTITY_FASTCLOSE_COMPLETE accepted={len(accepted)} remaining={remaining}", flush=True)
          PY
