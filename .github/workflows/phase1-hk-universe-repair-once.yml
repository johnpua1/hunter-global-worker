name: Hunter Phase 1 HK universe evidence repair once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-hk-universe-repair-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-phase1-hk-universe-evidence-repair
  cancel-in-progress: true

jobs:
  repair-hk-universe-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r hunter-global/requirements.txt
      - name: Refresh HK official listing evidence only
        working-directory: hunter-global
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_KEY: ${{ secrets.APPS_SCRIPT_SHARED_KEY }}
        run: |
          python runner.py --mode probe --market HK
          python runner.py --mode universe --market HK
