name: Hunter Phase 1 options source probe once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-options-source-probe-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r hunter-global/requirements.txt
      - name: Probe Yahoo optionChain sample
        working-directory: hunter-global
        run: |
          python - <<'PY'
          import time, requests
          symbols=["AAPL","MSFT","NVDA","SPY","QQQ","IWM","AMZN","META","TSLA","AMD"]
          for s in symbols:
              t=time.monotonic()
              try:
                  r=requests.get("https://query1.finance.yahoo.com/v7/finance/options/"+s,
                                 headers={"User-Agent":"Mozilla/5.0 Hunter/1.0"},timeout=15)
                  print(s,r.status_code,len(r.content),round(time.monotonic()-t,3),
                        r.text[:120].replace("\n"," "),flush=True)
              except Exception as e:
                  print(s,"EXC",type(e).__name__,str(e)[:120],round(time.monotonic()-t,3),flush=True)
          PY
