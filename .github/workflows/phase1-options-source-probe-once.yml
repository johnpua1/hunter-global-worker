name: Hunter Phase 1 options source probe once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-options-source-probe-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r hunter-global/requirements.txt
      - name: Probe Yahoo crumb session
        working-directory: hunter-global
        run: |
          python - <<'PY'
          import requests, urllib.parse, time
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"})
          for seed in ["https://fc.yahoo.com","https://finance.yahoo.com/quote/AAPL/options/"]:
              try:
                  r=s.get(seed,timeout=15,allow_redirects=True)
                  print("SEED",seed,r.status_code,"cookies",dict(s.cookies),flush=True)
              except Exception as e:
                  print("SEED_EXC",seed,type(e).__name__,str(e)[:160],flush=True)
          crumb=None
          for url in ["https://query1.finance.yahoo.com/v1/test/getcrumb",
                      "https://query2.finance.yahoo.com/v1/test/getcrumb"]:
              try:
                  r=s.get(url,timeout=15)
                  print("CRUMB",url,r.status_code,repr(r.text[:120]),"cookies",dict(s.cookies),flush=True)
                  if r.ok and r.text and "Too Many Requests" not in r.text:
                      crumb=r.text.strip(); break
              except Exception as e:
                  print("CRUMB_EXC",url,type(e).__name__,str(e)[:160],flush=True)
          for sym in ["AAPL","SPY","NVDA"]:
              url="https://query1.finance.yahoo.com/v7/finance/options/"+sym
              params={"crumb":crumb} if crumb else {}
              r=s.get(url,params=params,timeout=15)
              print("OPTION",sym,r.status_code,len(r.content),r.url,r.text[:180].replace("\n"," "),flush=True)
          PY
