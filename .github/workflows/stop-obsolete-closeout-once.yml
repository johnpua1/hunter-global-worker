name: Stop obsolete closeout execution once
on:
  push:
    branches: [main]
    paths: ['.repair-trigger/stop-obsolete-closeout-20261007']
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the inadvertently triggered historical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          root='https://api.github.com/repos/johnpua1/hunter-global-worker/actions/runs/37536253004'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def call(url,method='GET'):
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read()
                  return json.loads(data) if data else {}
          doc=call(root)
          if doc['head_sha']!='849121a13e392de8abb2899a33385684ea1d8324' or doc['name']!='Hunter quarantine tail closeout once':
              raise SystemExit('RUN_IDENTITY_MISMATCH')
          if doc['status']=='completed':
              print('ALREADY_TERMINAL='+str(doc['conclusion']))
          else:
              call(root+'/force-cancel','POST')
              print('TARGETED_CANCEL_REQUESTED')
          PY
